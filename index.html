<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:type" content="website">
<meta property="og:title" content="CineBox - Discover Movies & TV">
<meta property="og:description" content="Trending movies and TV, trailers, where to watch, and free full-length films you can watch right now.">

<title>CineBox - Discover Movies & TV</title>
<script>
/* Cache busting: always fetch the latest style.css and app.js */
window.__v = Date.now();
document.write('<link rel="stylesheet" href="style.css?v=' + window.__v + '">');
</script>
</head>
<body>

<header class="topbar">
  <a href="#/" class="logo">Cine<span>Box</span></a>
  <nav class="desk-nav">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/search" data-nav="search">Browse</a>
    <a href="#/free" data-nav="free">Free Movies</a>
    <a href="#/watchlist" data-nav="watchlist">My List</a>
  </nav>
  <form id="topSearch" class="top-search" autocomplete="off">
    <input type="search" id="topSearchInput" placeholder="Search movies & TV..." aria-label="Search">
    <div id="suggest" class="suggest hidden"></div>
  </form>
  <button id="installBtn" class="install hidden" type="button">Install</button>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <a href="#/" data-nav="home"><i>&#8962;</i><span>Home</span></a>
  <a href="#/search" data-nav="search"><i>&#9906;</i><span>Browse</span></a>
  <a href="#/free" data-nav="free"><i>&#9654;</i><span>Free</span></a>
  <a href="#/watchlist" data-nav="watchlist"><i>&#9733;</i><span>My List</span></a>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer class="footer">
  CineBox does not host or stream copyrighted content. Movie data and images by
  <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.
  Free movies are public-domain titles from the
  <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a>.
</footer>

<script>document.write('<script src="config.js?v=' + window.__v + '"><\/script><script src="app.js?v=' + window.__v + '"><\/script>');</script>
